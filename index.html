<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lunar Patrol</title>
  <meta name="description" content="A side-scrolling lunar buggy arcade game in the spirit of the classic 1982 coin-op.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Orbitron:wght@500;700;900&family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar" id="topbar">
    <div class="brand">
      <span class="logo-dot" aria-hidden="true"></span>
      <h1>LUNAR PATROL</h1>
      <span class="tag">Arcade tribute</span>
    </div>
    <nav class="actions" aria-label="Game controls">
      <button id="btnStart" class="btn primary">New Game</button>
      <button id="btnMode" class="btn">Mode: Remastered</button>
      <button id="btnPause" class="btn">Pause</button>
      <button id="btnSound" class="btn" aria-pressed="true">Sound: On</button>
      <button id="btnCrt" class="btn">CRT: Off</button>
      <button id="btnView" class="btn">View: Fill screen</button>
      <button id="btnScores" class="btn">High Scores</button>
      <button id="btnHelp" class="btn">How to Play</button>
      <button id="btnFull" class="btn">Fullscreen</button>
    </nav>
  </header>

  <main class="stage" id="stage">
    <div class="screen-wrap" id="screenWrap">
      <canvas id="screen" width="256" height="224" tabindex="0" aria-label="Game screen"></canvas>
    </div>
  </main>

  <div class="touch" aria-hidden="true">
    <div class="pad">
      <button class="tbtn" data-action="left">&#9664;</button>
      <button class="tbtn" data-action="right">&#9654;</button>
    </div>
    <div class="pad">
      <button class="tbtn start" data-action="start">START</button>
      <button class="tbtn jump" data-action="jump">JUMP</button>
      <button class="tbtn fire" data-action="fire">FIRE</button>
    </div>
  </div>

  <div class="modal-backdrop" id="modal" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <h2 id="modalTitle"></h2>
      <div id="modalBody"></div>
      <div class="modal-actions" id="modalActions"></div>
    </div>
  </div>

  <script src="js/audio.js"></script>
  <script src="js/game.js"></script>
  <script src="js/classic.js"></script>
  <script src="js/ui.js"></script>
</body>
</html>
